<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something About Isla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- COVER -->
    <section id="cover" class="screen active">
        <div class="cover-content">

            <p class="cover-for">AN ESSAY ON YOU</p>

            <h1>
                Something About
                <span class="isla-title">Isla</span>
            </h1>

            <p class="cover-main">
                My story between your fingers.
            </p>

            <p class="cover-subtitle">
                When, somewhere in the everyday,<br>
                there is always you.
            </p>

            <button id="enter-button">ENTER</button>

            <p class="cover-date">03 · 03 · 2027</p>

        </div>
    </section>


    <!-- ENVELOPE -->
    <section id="envelope-screen" class="screen">

        <p class="envelope-intro">
            You've received something.
        </p>

        <div class="envelope" id="envelope">

            <div class="envelope-back"></div>

            <div class="envelope-letter"></div>

            <div class="envelope-flap"></div>

            <div class="envelope-front"></div>

            <button class="envelope-seal" id="seal" aria-label="Open the envelope">
                <span>&lt;3</span>
            </button>

        </div>

        <p class="open-hint">open it.</p>

    </section>


    <!-- EMPTY LETTER -->
    <section id="letter-screen" class="screen">

        <article class="letter-content">
        </article>

    </section>


    <script src="script.js"></script>

</body>
</html>
